server.port=8082
spring.application.name=reservation-service

# NOTA DE EJECUCIÓN LOCAL: Los servicios Java corren con 'mvn spring-boot:run' en el host,
# conectándose a la infraestructura expuesta por 'infra/docker-compose.yml' en localhost.
# Si se containerizaran los servicios Java, estos hosts deberían ser nombres de servicio Docker.

spring.datasource.url=jdbc:postgresql://localhost:5432/ratchet_db
spring.datasource.username=ratchet
spring.datasource.password=ratchet_password
spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Autenticación JWT — apunta al servidor de identidad (Cypher/Keycloak) local.
# En un entorno real, reemplazar con la URL del IdP correspondiente.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/.well-known/jwks.json
