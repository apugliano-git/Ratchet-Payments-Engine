server.port=8083
spring.application.name=payment-service

# NOTA DE EJECUCIÓN LOCAL: Los servicios Java corren con 'mvn spring-boot:run' en el host,
# conectándose a la infraestructura expuesta por 'infra/docker-compose.yml' en localhost.
# Si se containerizaran los servicios Java, estos hosts deberían ser nombres de servicio Docker.

spring.datasource.url=jdbc:postgresql://localhost:5432/payment_db
spring.datasource.username=ratchet
spring.datasource.password=ratchet_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# TODO: Configurar por entorno (MP_WEBHOOK_SECRET), nunca hardcodear la clave real de Mercado Pago.
mercadopago.webhook.secret=${MP_WEBHOOK_SECRET:placeholder_secret}
