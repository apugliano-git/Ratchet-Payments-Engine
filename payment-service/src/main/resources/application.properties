server.port=8083
spring.application.name=payment-service

spring.datasource.url=jdbc:postgresql://localhost:5432/payment
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# TODO: Configurar por entorno (MP_WEBHOOK_SECRET), nunca hardcodear la clave real de Mercado Pago.
mercadopago.webhook.secret=${MP_WEBHOOK_SECRET:placeholder_secret}
