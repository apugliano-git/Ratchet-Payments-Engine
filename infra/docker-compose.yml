version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: ratchet-postgres
    # TODO: mover a variables de entorno / secrets antes de cualquier despliegue real, estas credenciales son solo para desarrollo local
    environment:
      POSTGRES_USER: ratchet
      POSTGRES_PASSWORD: ratchet_password
      POSTGRES_DB: ratchet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Script de inicialización: crea las tres bases de datos al primer arranque del contenedor.
      # La imagen oficial de postgres ejecuta automáticamente todos los archivos .sql y .sh
      # que encuentre en /docker-entrypoint-initdb.d/ (solo en volumen vacío / primer inicio).
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - ratchet-network
    restart: unless-stopped

  redpanda:
    # Imagen oficial community edition de Redpanda — sin Zookeeper (diseño intencional del proyecto).
    # El namespace correcto es docker.redpanda.com/redpandadata/redpanda (no redpanda/redpanda).
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: ratchet-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      # Puertos internos de Redpanda sin cambios; el mapeo de host fue ajustado
      # para evitar colisiones con los servicios Java (inventory:8081, reservation:8082)
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:18082
    ports:
      - "18081:8081"   # Schema Registry (remapeado de 8081 para evitar colisión con inventory-service)
      - "18082:8082"   # PandaProxy REST (remapeado de 8082 para evitar colisión con reservation-service)
      - "9092:9092"    # Kafka OUTSIDE (listener para aplicaciones locales)
      - "29092:29092"  # Kafka PLAINTEXT (listener interno entre contenedores)
    networks:
      - ratchet-network
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --notify-keyspace-events Ex
    container_name: ratchet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ratchet-network
    restart: unless-stopped

networks:
  ratchet-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
