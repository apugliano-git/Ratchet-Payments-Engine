version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: ratchet-postgres
    # TODO: mover a variables de entorno / secrets antes de cualquier despliegue real, estas credenciales son solo para desarrollo local
    environment:
      POSTGRES_USER: ratchet
      POSTGRES_PASSWORD: ratchet_password
      POSTGRES_DB: ratchet_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ratchet-network
    restart: unless-stopped

  redpanda:
    image: redpanda/redpanda:latest
    container_name: ratchet-redpanda
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "8081:8081"
      - "8082:8082"
      - "9092:9092"
      - "29092:29092"
    networks:
      - ratchet-network
    restart: unless-stopped

  redis:
    image: redis:7
    command: redis-server --notify-keyspace-events Ex
    container_name: ratchet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - ratchet-network
    restart: unless-stopped

networks:
  ratchet-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
